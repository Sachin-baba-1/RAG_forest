<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT RAG Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen p-8">
<div class="max-w-4xl mx-auto">

    <div class="bg-white rounded-2xl shadow-xl p-8 mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">📄 PPT RAG Assistant</h1>

        <form id="uploadForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Upload Document (optional)
                </label>
                <input type="file" name="file" accept=".pdf"
                       class="w-full p-3 border border-gray-300 rounded-xl">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Ask a Question
                </label>
                <input type="text" name="query" required
                       placeholder="e.g. Explain backpropagation in CNN"
                       class="w-full p-3 border border-gray-300 rounded-xl">
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 text-white py-3 rounded-xl hover:bg-blue-700 font-semibold">
                Generate Presentation
            </button>
        </form>
    </div>

    <!-- Loading -->
    <div id="loading" class="hidden text-center py-12">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
        <p class="mt-4 text-gray-600">Generating presentation...</p>
    </div>

    <!-- Results -->
    <div id="results" class="space-y-6 hidden"></div>

    <!-- Error -->
    <div id="error" class="hidden bg-red-50 border border-red-200 p-6 rounded-xl text-red-700"></div>

</div>

<script>
document.getElementById("uploadForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const formData = new FormData(e.target);
    const loading = document.getElementById("loading");
    const results = document.getElementById("results");
    const errorBox = document.getElementById("error");

    loading.classList.remove("hidden");
    results.classList.add("hidden");
    errorBox.classList.add("hidden");

    try {
        const res = await fetch("/upload_and_query", {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        if (data.status === "error") {
            errorBox.textContent = data.message;
            errorBox.classList.remove("hidden");
            return;
        }

        renderPPT(data.ppt, data.sources || []);
        results.classList.remove("hidden");

    } catch (err) {
        errorBox.textContent = "Something went wrong. Check backend logs.";
        errorBox.classList.remove("hidden");
    } finally {
        loading.classList.add("hidden");
    }
});

function renderPPT(ppt, sources) {
    const results = document.getElementById("results");

    let html = `
        <div class="bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-xl p-8">
            <h1 class="text-3xl font-bold">${ppt.title}</h1>
            <p>${ppt.slides.length} slides generated</p>
        </div>
    `;

    ppt.slides.forEach((slide, i) => {
        html += `
            <div class="bg-white rounded-xl shadow p-6">
                <h2 class="text-xl font-bold mb-2">
                    Slide ${i + 1}: ${slide.heading}
                </h2>
                <ul class="list-disc ml-6 space-y-2">
                    ${slide.points.map(p => `<li>${p}</li>`).join("")}
                </ul>
            </div>
        `;
    });

    if (sources.length > 0) {
        html += `
            <div class="bg-gray-100 rounded-xl p-6">
                <h3 class="font-bold mb-4">📚 Sources</h3>
                <ul class="space-y-2">
                    ${sources.map(s => `<li>📄 ${s.filename}</li>`).join("")}
                </ul>
            </div>
        `;
    }

    results.innerHTML = html;
}
</script>

</body>
</html>
