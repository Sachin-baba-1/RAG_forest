<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT RAG Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Upload Form -->
        <div class="bg-white rounded-2xl shadow-xl p-8 mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-6">📄 PPT RAG Assistant</h1>
            <form id="uploadForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Upload Documents</label>
                    <input type="file" name="file"  accept=".pdf" 
                           class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Ask a Question</label>
                    <input type="text" name="query" placeholder="e.g., What are the key findings?" required
                           class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 px-6 rounded-xl hover:bg-blue-700 transition-all font-semibold">
                    Generate Presentation
                </button>
            </form>
        </div>

        <!-- Results -->
        <div id="results" class="space-y-6 hidden"></div>

        <!-- Loading -->
        <div id="loading" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            <p class="mt-4 text-gray-600 font-medium">Generating your presentation...</p>
        </div>

        <!-- Debug Info -->
        <div id="debug" class="bg-yellow-50 p-4 rounded-xl mt-8 hidden">
            <h3 class="font-bold text-yellow-800 mb-2">Debug Info:</h3>
            <pre id="debugContent"></pre>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');
            const debugDiv = document.getElementById('debug');
            const debugContent = document.getElementById('debugContent');
            
            // Show loading
            resultsDiv.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            debugDiv.classList.add('hidden');
            
            try {
                const response = await fetch(
                    '/upload_and_query',{
                    method: 'POST',
                    body: formData
                });

                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (data.status === 'No match') {
                    resultsDiv.innerHTML = `
                        <div class="bg-orange-50 border border-orange-200 rounded-2xl p-8 text-center">
                            <div class="text-4xl mb-4">❌</div>
                            <h2 class="text-2xl font-bold text-gray-900 mb-2">${data.message}</h2>
                            <p class="text-gray-600">Try uploading different documents or rephrasing your question.</p>
                        </div>
                    `;
                        } else if (data.ppt) {
            console.log("ppt object:", data.ppt);
            console.log("slides:", data.ppt.slides);

            resultsDiv.classList.remove('hidden');
            renderPPT(data.ppt, data.sources || []);
                }

                } else {
                    throw new Error('Unexpected response format');
                }
            } catch (error) {
                console.error('Full error:', error);
                debugContent.textContent = `Error: ${error.message}\n\nResponse: ${await response?.text?.() || 'No response'}`;
                debugDiv.classList.remove('hidden');
                resultsDiv.innerHTML = `
                    <div class="bg-red-50 border border-red-200 rounded-2xl p-8 text-center">
                        <div class="text-4xl mb-4">⚠️</div>
                        <h2 class="text-2xl font-bold text-gray-900 mb-2">Something went wrong</h2>
                        <p class="text-gray-600">${error.message}</p>
                        <p class="text-sm mt-2">Check debug info below.</p>
                    </div>
                `;
            } finally {
                loadingDiv.classList.add('hidden');            }
        });

        function renderPPT(ppt, sources) {
            const resultsDiv = document.getElementById('results');
            
            let html = `
                <div class="bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-2xl p-8 mb-8 shadow-2xl">
                    <h1 class="text-4xl font-bold mb-2">${ppt.title}</h1>
                    <p class="opacity-90">${ppt.slides.length} slides generated</p>
                </div>
            `;
            
            ppt.slides.forEach((slide, index) => {
                html += `
                    <div class="bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-2xl transition-all mb-6">
                        <div class="bg-gradient-to-r from-indigo-500 to-purple-600 px-6 py-4 text-white">
                            <h2 class="text-2xl font-bold">${slide.heading}</h2>
                            <span class="text-sm opacity-90">Slide ${index + 1}</span>
                        </div>
                        <div class="p-8">
                            <ul class="space-y-3">
                                ${slide.points.map(point => 
                                    `<li class="flex items-start">
                                        <span class="w-2 h-2 bg-indigo-500 rounded-full mt-2 mr-3 flex-shrink-0"></span>
                                        <span class="text-lg leading-relaxed">${point}</span>
                                    </li>`
                                ).join('')}
                            </ul>
                        </div>
                    </div>
                `;
            });
            
            if (sources && sources.length > 0) {
                html += `
                    <div class="bg-gradient-to-r from-gray-50 to-gray-100 rounded-2xl p-8 mt-8">
                        <h3 class="text-2xl font-bold text-gray-900 mb-6 flex items-center">
                            📚 Sources (${sources.length})
                        </h3>
                        <div class="grid md:grid-cols-2 gap-4">
                            ${sources.map((source, i) => `
                                <div class="bg-white p-6 rounded-xl border border-gray-200 hover:shadow-md transition-all">
                                    <div class="flex justify-between items-start mb-2">
                                        <span class="font-semibold text-indigo-600">Source ${i+1}</span>
                                        ${source.page ? `<span class="text-sm text-gray-500">Page ${source.page}</span>` : ''}
                                    </div>
                                    <p class="text-gray-700 text-sm">${source.source || 'Document'}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
